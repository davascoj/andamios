<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andamios1 - Visor 3D</title>
  <style>
    html, body { margin:0; height:100%; overflow:hidden; font-family:Arial,sans-serif; background:#111; color:white; }
    #viewer { width:100vw; height:100vh; display:block; }
    #panel { position:fixed; left:14px; top:14px; z-index:10; background:rgba(0,0,0,.65); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:12px 14px; max-width:420px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
    #panel h1 { margin:0 0 6px; font-size:16px; }
    #panel p { margin:3px 0; font-size:13px; color:#ddd; }
    #loading { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.75); z-index:20; font-size:18px; }
    #error { color:#ffb4b4; margin-top:8px; font-size:13px; display:none; }
    button { margin-top:8px; padding:6px 10px; border-radius:8px; border:0; cursor:pointer; background:#f1f1f1; }
  </style>
</head>
<body>
  <div id="panel">
    <h1>Andamios1</h1>
    <p><b>Controles:</b> clic izquierdo = rotar, rueda = zoom, clic derecho = mover.</p>
    <p>Archivo cargado: <b>Andamios1.glb</b></p>
    <button id="resetBtn">Centrar modelo</button>
    <div id="error"></div>
  </div>
  <div id="loading">Cargando modelo 3D...</div>
  <canvas id="viewer"></canvas>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    const canvas = document.getElementById('viewer');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x151515);
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.01, 1000000);
    camera.position.set(8,8,8);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
    const dir = new THREE.DirectionalLight(0xffffff, 2.5);
    dir.position.set(10,12,8);
    scene.add(dir);
    const grid = new THREE.GridHelper(20,20,0x666666,0x333333);
    scene.add(grid);
    let loadedObject = null;
    function hideLoading(){ document.getElementById('loading').style.display='none'; }
    function showError(msg){ hideLoading(); const el=document.getElementById('error'); el.textContent=msg; el.style.display='block'; }
    function fitCameraToObject(object){
      loadedObject = object;
      const box = new THREE.Box3().setFromObject(object);
      const size = new THREE.Vector3();
      const center = new THREE.Vector3();
      box.getSize(size); box.getCenter(center);
      const maxDim = Math.max(size.x,size.y,size.z);
      const distance = maxDim > 0 ? maxDim * 1.8 : 10;
      camera.position.set(center.x+distance, center.y+distance, center.z+distance);
      camera.near = Math.max(distance/1000, 0.01);
      camera.far = distance*1000;
      camera.updateProjectionMatrix();
      controls.target.copy(center); controls.update();
      grid.position.set(center.x, box.min.y, center.z);
      grid.scale.setScalar(Math.max(maxDim/20, 1));
    }
    document.getElementById('resetBtn').addEventListener('click', () => { if(loadedObject) fitCameraToObject(loadedObject); });
    
        import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
        const loader = new GLTFLoader();
        loader.load('./Andamios1.glb', (gltf) => {
          const object = gltf.scene;
          scene.add(object);
          fitCameraToObject(object);
          hideLoading();
        }, undefined, (error) => {
          showError('No se pudo cargar el GLB. Revisa que el archivo este junto al HTML.');
          console.error(error);
        });
      
    function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
    animate();
    window.addEventListener('resize', () => { camera.aspect=window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth,window.innerHeight); });
  </script>
</body>
</html>
